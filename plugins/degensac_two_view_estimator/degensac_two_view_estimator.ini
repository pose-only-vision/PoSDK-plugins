# ============================================================================
# Degensac Two-View Pose Estimation Configuration File (Pure C++)
# Degensac 双视图位姿估计配置文件（纯C++版本，无需Python依赖）
# Algorithm: DEGENSAC = LO-RANSAC + Degeneracy Detection
# ============================================================================

[degensac_two_view_estimator]

# @name: Configuration Description | 配置描述
# @readonly
ProfileCommit=Degensac Two-View Pose Estimation (Pure C++ Version)

## ====================
## View Pair | 视图对
## ====================

# @hidden
view_i=0
# @hidden
view_j=1

## ====================
## Core Parameters | 核心参数
## ====================

# @name: RANSAC Threshold | RANSAC阈值
# @type: float
# @details: Reprojection error threshold (pixels). Degensac internally squares it for Sampson error. Recommended: 0.3-2.0 | 重投影误差阈值（像素）。Degensac内部平方用于Sampson误差。推荐: 0.3-2.0
ransac_threshold=1

# @name: Confidence | 置信度
# @type: float
# @range: 0.0, 1.0
# @details: RANSAC confidence level. 0.99=fast, 0.9999=recommended, 0.99999=max robustness | RANSAC置信度
confidence=0.999

# @name: Max Iterations | 最大迭代次数
# @type: int
# @range: 1000, 1000000
# @details: Maximum iteration count. Degensac uses adaptive stopping, often converges early. Recommended: 100000 | 最大迭代次数。Degensac使用自适应停止，通常提前收敛
max_iterations=50000

# @name: Random Seed | 随机种子
# @type: int
# @range: 0, 2147483647
# @details: Explicit seed for the plugin-owned thread-local DEGENSAC sampler. The same inputs and seed produce the same sampling sequence | 插件线程局部DEGENSAC采样器的显式种子；相同输入与种子产生相同采样序列
random_seed=0

## ====================
## Degensac Parameters | Degensac专有参数
## ====================

# @name: Enable Degeneracy Check | 启用退化检测
# @type: bool
# @details: Enable DEGENSAC degeneracy detection for planar scenes. Keep enabled for robust estimation | 启用DEGENSAC退化检测以处理平面场景。推荐保持启用
enable_degeneracy_check=true

# @name: Error Type | 误差函数类型
# @options: sampson, symm_epipolar
# @details: sampson: Sampson error (recommended, more accurate) | Sampson误差（推荐，更准确）
# @details: symm_epipolar: Symmetric epipolar error | 对称极线误差
error_type=sampson

# @name: Symmetric Error Check | 对称误差检查
# @type: bool
# @details: true: Check error in both directions | 双向检查误差;
# @details: false: One direction only | 仅单向
symmetric_error_check=true

# @name: LAF Coefficient | LAF一致性系数
# @type: float
# @details: Local Affine Frame consistency coefficient. 0.0=disable LAF check (point correspondences only), >0.0=enable (requires affine data) | 局部仿射帧一致性系数。0.0=禁用
laf_coefficient=0.0

## ====================
## Performance Analysis | 性能分析
## ====================

# @name: Log Level | 日志级别
# @options: 0, 1, 2
# @details: 0: No log output | 无日志输出
# @details: 1: Normal log | 普通日志
# @details: 2: Verbose log | 详细日志
log_level=2

# @name: Enable Profiling | 启用性能分析
# @type: bool
enable_profiling=false

# @name: Enable Evaluator | 启用评估
# @type: bool
enable_evaluator=false
