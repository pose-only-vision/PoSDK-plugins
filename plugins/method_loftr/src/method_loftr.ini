# ============================================================================
# LoFTR Detector-Free Feature Matching Configuration File
# LoFTR 无检测器特征匹配配置文件
# ============================================================================

[method_loftr]

# @name: Configuration Description | 配置描述
# @readonly
ProfileCommit=LoFTR detector-free feature matching

## ====================
## Performance Analysis | 性能分析
## ====================

# @name: Enable Profiling | 启用性能分析
# @type: bool
# @details: Collect detailed timing data for each computation stage | 收集每个计算阶段的详细时间数据
enable_profiling=true

# @name: Metrics Config | 性能指标配置
# @details: Available: time, memory, cpu. Format: "time" or "time|memory|cpu" | 可用: time, memory, cpu
metrics_config=time

# @name: Enable Evaluator | 启用评估
# @type: bool
enable_evaluator=false

# @name: Log Level | 日志级别
# @options: 0, 1, 2
# @details: 0: No log output | 无日志输出
# @details: 1: Normal log | 普通日志
# @details: 2: Verbose log | 详细日志
log_level=0

## ====================
## Run Configuration | 运行配置
## ====================

# @name: Run Mode | 运行模式
# @details: fast=fast mode | 快速模式
run_mode=fast

# @name: Execution Backend | 执行位置
# @options: ssh, local
# @details: ssh uploads input images, runs LoFTR on the selected server, and downloads results. local runs inference on this computer. | ssh 上传输入图像到指定服务器进行匹配并取回结果；local 在本机推理。
execution_backend=ssh

## SSH Remote Server | SSH 远端服务器

# @name: SSH Target | SSH 目标
# @details: OpenSSH alias or user@host. Defaults to the local remoteMAC profile; uses existing SSH keys or agent. | OpenSSH 别名或 user@host，默认使用本机 remoteMAC 配置，复用现有 SSH 密钥或代理。
ssh_target=remoteMAC

# @name: SSH Port | SSH 端口
# @type: int
# @range: 0, 65535
# @details: 0 follows the SSH configuration (normally 22). | 0 使用 SSH 配置中的端口，通常为 22。
ssh_port=0

# @name: SSH Identity File | SSH 私钥文件
# @type: path
# @details: Optional local key-file path; empty uses OpenSSH configuration or agent. The key is never uploaded. | 可选的本机私钥文件路径，留空使用 OpenSSH 配置或代理；不会上传私钥。
ssh_identity_file=

# @name: Remote Python | 远端 Python
# @details: Python from the supported remote LoFTR environment. This is a server path, not a local executable. | 支持版本的远端 LoFTR 环境中的 Python，这是服务器路径，不是本机程序。
ssh_python_executable=~/.local/share/PoSDK/LoFTR/current/bin/python3.11

# @name: Remote Working Directory | 远端工作目录
# @details: Private per-job folders are created here; supports ~/ paths. Only the current job is removed after download. | 在此创建每次任务独立的私有目录，支持 ~/ 路径；下载结果后只清理本次任务。
ssh_work_dir=~/.cache/PoSDK/LoFTR

# @name: Remote Checkpoint | 远端模型权重
# @details: Empty uses the hash-verified indoor/outdoor weights in the remote managed environment. Mutually exclusive with a local checkpoint_path. | 留空使用远端托管环境中经哈希校验的室内或室外权重；与本机 checkpoint_path 二选一。
ssh_checkpoint_path=

# @name: SSH Connection Timeout | SSH 连接超时
# @type: int
# @range: 1, 120
# @details: Seconds. Host-key verification is always required; no password prompt. | 单位秒；始终校验主机密钥，不弹出密码提示。
ssh_connect_timeout=15

# @name: Remote Matching Timeout | 远端匹配超时
# @type: int
# @range: 5, 86400
# @details: Seconds. Timeout or cancellation stops this job; it never falls back to local inference. | 单位秒；超时或取消会停止本次任务，不自动转为本地推理。
ssh_run_timeout=3600

# @name: Download Size Limit | 下载结果大小上限
# @type: int
# @range: 1, 65536
# @details: MiB; downloaded files are checked for completeness and SHA-256 integrity before use. | 单位 MiB；使用前检查下载文件的完整性和 SHA-256。
ssh_result_limit_mb=8192

# @name: Keep Remote Job | 保留远端任务目录
# @type: bool
# @details: Keep uploaded images and results for inspection. Explicit pair caches are retained regardless. | 保留上传图像和结果供检查；显式配置的匹配缓存始终保留。
ssh_keep_work_dir=false

## Local Process | 本机进程

# @name: Num Threads | 线程数
# @type: int
# @range: 1, 16
# @details: LoFTR uses GPU, single-thread recommended for subprocess calls | LoFTR使用GPU，子进程调用推荐单线程
num_threads=1

## ====================
## Feature Export | 特征导出
## ====================

# @name: Export Features | 导出特征文件
# @type: bool
export_features=false

# @name: Export Feature Path | 特征输出路径
# @type: path
export_fea_path=storage/features

## ====================
## Match Export | 匹配导出
## ====================

# @name: Export Matches | 导出匹配文件
# @type: bool
export_matches=false

# @name: Export Match Path | 匹配输出路径
# @type: path
export_match_path=storage/matches

# ============================================================================
# LoFTR Matcher Configuration | LoFTR匹配器配置
# ============================================================================

## LoFTR | LoFTR

## ====================
## Model Configuration | 模型配置
## ====================

# @name: Model Type | 预训练模型类型
# @options: indoor, outdoor
# @details: indoor: Optimized for indoor scenes (ScanNet pretrained) | 针对室内场景优化（ScanNet预训练）
# @details: outdoor: Optimized for outdoor scenes (MegaDepth pretrained) | 针对室外场景优化（MegaDepth预训练）
model_type=outdoor

## ====================
## Matching Parameters | 匹配参数
## ====================

# @name: Max Matches per Pair | 每对图像的匹配上限
# @type: int
# @range: 0, 100000
# @details: Maximum eligible matches per pair; 0 disables truncation. | 每对有效匹配上限；0不截断数量。
max_keypoints=0

# @name: Confidence Threshold | 置信度阈值
# @type: float
# @range: 0.0, 1.0
# @details: Minimum confidence for matches. Higher=stricter filtering. Recommended: 0.1-0.3 | 匹配最低置信度。越高过滤越严格。推荐: 0.1-0.3
confidence_threshold=0.2

# @name: Resize Max | 输入图像最大边长
# @type: int
# @range: 320, 2400
# @details: Maximum input dimension before divisor-eight alignment. Larger images increase memory use and may produce more matches. | 按8对齐前的输入图像最大边长；增大尺寸会增加显存开销，可能获得更多匹配。
resize_max=1024

## ====================
## Device Configuration | 设备配置
## ====================

# @name: Device | 计算设备
# @options: auto, mps, cuda, cpu
# @details: auto: Auto-detect best device (MPS on Apple Silicon, CUDA on NVIDIA, else CPU) | 自动检测最佳设备
# @details: mps: Force Apple Metal (macOS only) | 强制Apple MPS（仅macOS）
# @details: cuda: Force NVIDIA CUDA | 强制NVIDIA CUDA
# @details: cpu: Force CPU | 强制CPU
device=auto

## ====================
## Environment | 环境配置
## ====================

# @name: Python Executable | Python可执行文件
# @details: Local Python for the SSH controller (standard library only); local inference additionally needs the pinned model environment. | SSH 控制进程只使用本机 Python 标准库；本地推理还需要锁定版本的模型环境。
python_executable=

# @name: Managed Python Bin Folder | 托管 Python 目录
# @type: path
# @readonly
# @details: Filled by the signed bundled installer. No system Python fallback. | 由 App 内附的签名安装器填写，不回退到系统 Python。
python_bin_folder=

# @name: Script Path | LoFTR脚本路径
# @type: path
# @details: Batch worker script path (empty=auto-detection) | 批量匹配脚本路径（空=自动检测）
script_path=

# @name: Checkpoint Path | 模型权重路径
# @type: path
# @details: Optional local checkpoint; SSH mode uploads it to the private job. Empty uses the selected environment's supported weights. | 可选本机权重，SSH 模式会上传到本次私有任务；留空使用所选环境的支持版本权重。
checkpoint_path=

# @name: CPU Threads | CPU线程数
# @type: int
# @range: 1, 64
cpu_threads=6

# @name: Keypoint Merge Radius | 跨图像对关键点合并半径
# @type: float
# @range: 0.1, 8.0
# @details: Maximum distance in original-image pixels for reusing one feature ID across image pairs. | 跨图像对复用同一特征编号的最大距离，以原图像素为单位。
keypoint_merge_radius=1.0

# @name: Keypoint Cell Size | 特征关联单元大小
# @type: float
# @range: 0.0, 32.0
# @details: Original-image pixels; 0 follows the merge radius. Larger cells select the most-supported fine location, while assignment stays bounded by the merge radius. | 原图像素；0跟随关联半径。较大单元选择置信支持最多的精细位置，最终关联距离仍受关联半径限制。
keypoint_cell_size=0.0

# @name: Max Features per Image | 每图特征上限
# @type: int
# @range: 0, 2000000
# @details: 0 keeps all aggregated features; a positive limit selects by collection-wide confidence support. | 0保留全部关联特征；正数按跨视图置信支持选择。
max_keypoints_per_image=0

# @name: Raw Pair Cache | 原始匹配缓存
# @details: Optional lossless inference cache on the selected execution host (server path in SSH mode). Requires a pinned checkpoint. | 所选执行主机上的可选无损缓存，SSH 模式填写服务器路径；要求固定权重。
pair_cache_dir=

# @name: Weak-view Rotation Retry | 弱支持视图旋转重试
# @type: bool
# @details: Try grid-aligned quarter turns only on unreliable pairs incident to weakly supported views; keep the original pair unless geometric support improves substantially. | 仅对弱支持视图关联的不可靠图像对重试90度旋转；几何支持显著改善时才采用新结果。
rotation_rescue=false

# @name: Baseline Pair Cache | 基础匹配缓存
# @details: Optional immutable zero-rotation cache on the selected execution host. Empty creates a baseline below the new cache directory. | 所选执行主机上的可选原方向匹配缓存；留空会在新缓存目录下生成基础匹配。
base_pair_cache_dir=

# @name: Refined Endpoint | 精细匹配端点
# @options: second, first
# @details: second preserves the Kornia ordering; first follows HLOC's query ordering. Each mode uses its own validated inference cache. | second沿用Kornia顺序；first按HLOC方式细化查询图像。两种模式分别校验缓存。
refine_endpoint=second

# @name: Pair Geometry Verification | 图像对几何验证
# @options: none, magsac, magsac_seed, magsac_post
# @details: magsac prunes before association; magsac_seed preserves raw rows and marks seeds; magsac_post filters after association and preserves the raw feature ID space. Calibrated two-view estimation remains required. | magsac在关联前筛选；magsac_seed保留原始行并标记种子；magsac_post在关联后筛选并保留原始特征编号空间；仍须进行标定双视图估计。
pair_geometry=none

# @name: Geometry Threshold (Network Pixels) | 几何阈值（网络像素）
# @type: float
# @range: 0.1, 4.0
# @details: Threshold on the actual resized network coordinates, not original-image pixels. | 在实际缩放后的网络坐标上计算阈值，而非直接按原图像素。
geometry_threshold=1.0
