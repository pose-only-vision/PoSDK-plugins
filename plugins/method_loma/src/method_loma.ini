[method_loma]
# @name: Configuration Description | 配置描述
ProfileCommit=LoMa-B official ONNX / stable sparse IDs / RGB / SSH
# @name: Enable Profiling | 启用性能分析
# @type: bool
enable_profiling=true
# @name: Enable Evaluator | 启用评估
# @type: bool
enable_evaluator=false
# @name: Log Level | 日志级别
# @options: 0, 1, 2
log_level=1

## Execution | 执行
# @name: Managed Controller Python Directory | 受管控制器 Python 目录
# @details: Installed automatically; this environment has no neural-model dependencies. | 安装器自动设置，本机环境不含神经网络依赖。
python_bin_folder=
# @name: Development Controller Python | 开发用控制器 Python
# @details: Used only when the managed directory is empty. | 仅在受管目录为空时使用。
python_executable=/usr/bin/python3
# @name: SSH Target | SSH 目标
ssh_target=remoteMAC
# @name: Remote Python | 远端 Python
ssh_python_executable=~/.local/share/PoSDK/LoMa/0.1.0/macos-arm64/env/bin/python3.11
# @name: Remote Runtime Root | 远端模型运行库
runtime_root=~/.local/share/PoSDK/LoMa/0.1.0/macos-arm64
# @name: Remote Working Directory | 远端临时作业目录
ssh_work_dir=~/.cache/PoSDK/LoMa
# @name: Existing Remote Images (optional) | 已有远端图像（可选）
# @details: Reuse requires identical size and SHA-256. | 仅复用大小和 SHA-256 都相同的图像。
remote_image_root=
# @name: Timeout (seconds) | 超时（秒）
# @type: int
# @range: 30, 86400
timeout_seconds=7200
# @name: Backend | 推理后端
# @options: coreml, cpu
# @details: CoreML accelerates the descriptor with explicitly declared CPU partitions; all model work is remote. | CoreML 用于描述子并显式保留 CPU 分区，所有模型工作均在远端。
device=coreml
# @name: CPU Threads | CPU 线程
# @type: int
# @range: 1, 32
cpu_threads=6

## LoMa-B | 官方 LoMa-B
# @name: Model Variant | 模型变体
# @options: b
setting=b
# @name: Keypoints per Image | 每图关键点数
# @type: int
# @range: 64, 8192
max_keypoints=1280
# @name: Detector Long Edge | 检测图像长边
# @type: int
# @range: 128, 4096
resize_long_edge=1024
# @name: Match Confidence Threshold | 匹配置信度阈值
# @type: double
# @range: 0, 1
confidence_threshold=0.1
# @name: Random Seed | 随机种子
# @type: int
seed=31
