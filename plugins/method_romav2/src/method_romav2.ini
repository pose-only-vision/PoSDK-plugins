[method_romav2]
# @name: Configuration Description | 配置描述
ProfileCommit=RoMa v2 official pretrained model / RGB / SSH
# @name: Enable Profiling | 启用性能分析
# @type: bool
enable_profiling=true
# @name: Enable Evaluator | 启用评估
# @type: bool
enable_evaluator=false
# @name: Log Level | 日志级别
# @options: 0, 1, 2
log_level=1

## Execution | 执行
# @name: Managed Controller Python Directory | 受管控制器 Python 目录
# @details: Set by the signed installer; model inference stays on the configured SSH host. | 由签名安装器设置，本机不执行模型推理。
python_bin_folder=
# @name: Local Controller Python | 本机控制器 Python
# @details: Only standard-library imports locally. | 本机只导入标准库。
python_executable=/usr/bin/python3
# @name: SSH Target | SSH 目标
ssh_target=remoteMAC
# @name: Remote Python | 远端 Python
ssh_python_executable=~/.local/share/PoSDK/RoMaV2/0.1.0/macos-arm64/env/bin/python3
# @name: Remote Runtime Root | 远端运行库根目录
# @details: Contains vendor/RoMaV2, vendor/DINOv3 and assets/romav2.0.1.pt. | 包含固定版本源码及官方权重。
runtime_root=~/.local/share/PoSDK/RoMaV2/0.1.0/macos-arm64
# @name: Remote Working Directory | 远端工作目录
ssh_work_dir=~/.cache/PoSDK/RoMaV2
# @name: Existing Remote Images (optional) | 已有远端图像（可选）
# @details: Every image must match the local size and SHA-256; mismatches stop the run. | 逐张校验与本机大小和 SHA-256 一致，否则停止。
remote_image_root=
# @name: Timeout (seconds) | 超时（秒）
# @type: int
# @range: 30, 86400
timeout_seconds=7200
# @name: Device | 计算设备
# @options: mps, cpu
device=mps
# @name: CPU Threads | CPU 线程
# @type: int
# @range: 1, 32
cpu_threads=4

## Official Model | 官方模型
# @name: RoMa v2 Setting | RoMa v2 档位
# @options: turbo, fast, base, precise
# @details: Official presets; FP32 on Apple MPS. No research adapter. | 官方档位，Apple MPS 使用 FP32，不加载研究微调适配器。
setting=fast
# @name: Samples per Pair | 每对采样数
# @type: int
# @range: 64, 10000
num_matches=5000
# @name: Minimum Overlap | 最小重叠置信度
# @type: double
# @range: 0, 1
confidence_threshold=0.2
# @name: Merge Radius (original pixels) | 合并半径（原图像素）
# @type: double
# @range: 0.1, 10
keypoint_merge_radius=1.0
# @name: Random Seed | 随机种子
# @type: int
seed=31
