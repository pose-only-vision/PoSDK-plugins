# ============================================================================
# SuperPoint + LightGlue Dataset Frontend | SuperPoint + LightGlue 数据集前端
# ============================================================================

[method_superpoint_lightglue]

# @name: Configuration Description | 配置描述
# @readonly
ProfileCommit=SuperPoint + LightGlue v0.1_arxiv (Balanced 1024/1280, Pillow-RGB, stable IDs, auto=CPU)

# @Prior: data_images

## ====================
## Input | 输入
## ====================

# @name: Image Folder | 图像文件夹
# @type: path
# @path_mode: folder
# @details: Optional Developer fallback when data_images is not connected. Marketplace workflows should connect data_images. | data_images 未连接时的可选 Developer 回退；Marketplace 工作流应连接 data_images。
image_folder=

## ====================
## Model Pair | 模型组合
## ====================

# @name: Backend | 后端
# @readonly
# @hidden
backend=python_worker

# @name: Extractor | 特征提取器
# @readonly
extractor=superpoint

# @name: Matcher | 匹配器
# @readonly
matcher=superpoint_lightglue

# @name: Device | 计算设备
# @options: auto, cpu, mps, cuda
# @details: auto/cpu use CPU; mps runs extraction on CPU and matching on Metal; cuda explicitly requires CUDA for both stages. | auto/cpu 使用 CPU；mps 在 CPU 提取、Metal 匹配；cuda 要求两阶段均可使用 CUDA。
device=auto

## ====================
## Pair Graph | 图像对图
## ====================

# @name: Pair Mode | 图像对模式
# @options: exhaustive, contiguous
# @details: exhaustive matches every i<j pair and is the full-scene pair mode. contiguous limits matching to a temporal window. | exhaustive 匹配全部 i<j 图像对，是完整场景图像对模式；contiguous 仅匹配时序窗口。
pair_mode=exhaustive

# @name: Contiguous Pair Window | 连续匹配窗口
# @type: int
# @range: 1, 1000
# @details: Used only when pair_mode=contiguous. | 仅在 pair_mode=contiguous 时使用。
pair_window=5

## ====================
## SuperPoint | SuperPoint
## ====================

# @name: Maximum Keypoints | 最大特征点数
# @type: int
# @range: 128, 20000
# @details: Maximum stable keypoint count per image. The same indices are reused by every matched pair. Marketplace default: Balanced=1280. For a speed-first preset use 512 together with resize_long_edge=896. The 4096-point high-accuracy setting is manual and has substantially higher memory use. | 每图稳定特征点数量上限；所有图像对复用同一组索引。Marketplace 默认：Balanced=1280。速度优先档请与 resize_long_edge=896 配合使用 512。4096 点高精度档需手工设置，内存占用显著更高。
max_keypoints=1280

# @name: Resize Long Edge | 长边缩放
# @type: int
# @range: 256, 4096
# @details: SuperPoint inference resolution. Returned coordinates are mapped back to the original image. Marketplace default: Balanced=1024. For a speed-first preset use 896 together with max_keypoints=512. The 1600 setting is a manual high-resolution option, not the default. | SuperPoint 推理分辨率；输出坐标会映射回原图。Marketplace 默认：Balanced=1024。速度优先档请与 max_keypoints=512 配合使用 896。1600 是手工高分辨率选项，不是默认值。
resize_long_edge=1024

# @name: Detection Threshold | 检测阈值
# @type: float
# @range: -1.0, 1.0
# @details: Score threshold before the max_keypoints cap. -1 selects exact top-K mode. | max_keypoints 截断前的分数阈值；-1 表示精确 top-K 模式。
detection_threshold=0.0005

## ====================
## LightGlue | LightGlue
## ====================

# @name: Match Filter Threshold | 匹配过滤阈值
# @type: float
# @range: 0.0, 1.0
filter_threshold=0.10

# @name: Depth Confidence | 深度自适应置信度
# @type: float
# @range: -1.0, 1.0
# @details: LightGlue early-stop confidence. -1 disables depth adaptation. | LightGlue 提前终止置信度；-1 禁用深度自适应。
depth_confidence=0.95

# @name: Width Confidence | 宽度自适应置信度
# @type: float
# @range: -1.0, 1.0
# @details: LightGlue point-pruning confidence. -1 disables width adaptation. | LightGlue 点裁剪置信度；-1 禁用宽度自适应。
width_confidence=0.99

## ====================
## Execution | 执行位置

# @name: Execution Backend | 执行位置
# @options: local, ssh
# @details: SSH uploads images, verifies the remote model, runs inference and downloads hash-verified results. | SSH 上传图像、验证远端模型、执行推理并取回哈希校验后的结果。
execution_backend=local

# @name: SSH Target | SSH 目标
ssh_target=remoteMAC

# @name: SSH Port | SSH 端口
# @type: int
# @range: 0, 65535
ssh_port=0

# @name: SSH Identity File | SSH 私钥文件
# @type: path
ssh_identity_file=

# @name: Remote Python | 远端 Python
# @details: Absolute remote managed Python 3.11.11 executable; supports ~/ paths. | 远端托管 Python 3.11.11 绝对路径，支持 ~/。
ssh_python_executable=

# @name: Remote Runtime Folder | 远端运行时目录
# @details: Empty uses runtime/ beside the remote env/ directory. | 留空使用远端 env/ 同级的 runtime/ 目录。
ssh_runtime_folder=

# @name: Remote Working Directory | 远端工作目录
ssh_work_dir=~/.cache/PoSDK/SuperPointLightGlue

# @name: SSH Connect Timeout | SSH 连接超时
# @type: int
# @range: 1, 120
ssh_connect_timeout=15

# @name: SSH Run Timeout | SSH 执行超时
# @type: int
# @range: 5, 86400
ssh_run_timeout=3600

# @name: Download Size Limit (MiB) | 下载上限（MiB）
# @type: int
# @range: 1, 65536
ssh_result_limit_mb=8192

# @name: Keep Remote Job | 保留远端任务
# @type: bool
ssh_keep_work_dir=false

## Private Runtime | 私有运行环境
## ====================

# @name: Managed Python Bin Folder | 托管 Python 目录
# @type: path
# @readonly
# @details: Filled only by the signed Marketplace installer. Each plugin version has an isolated environment. | 仅由签名 Marketplace 安装器填写；每个插件版本使用隔离环境。
python_bin_folder=

# @name: Advanced Python Override | 高级 Python 覆盖
# @type: path
# @details: Optional absolute Python 3.11.11 executable for Developer diagnostics. No ambient Python fallback is used. | 仅供 Developer 诊断的可选 Python 3.11.11 绝对路径；不会回退到系统 Python。
python_executable=

# @name: Advanced Runtime Override | 高级运行时覆盖
# @type: path
# @path_mode: folder
# @details: Optional Developer-only runtime containing LightGlue, identity.json, and pinned checkpoints. Leave empty for the installer-managed sibling runtime. | 可选 Developer 运行时目录，需包含 LightGlue、identity.json 和锁定权重；留空使用安装器托管目录。
runtime_folder=

# @name: CPU Threads | CPU 线程数
# @type: int
# @range: 1, 64
cpu_threads=6

# @name: Worker Timeout | Worker 超时
# @type: int
# @range: 30, 7200
# @details: Whole-dataset worker timeout in seconds. A timeout terminates the worker and fails the complete run. | 整数据集 worker 超时秒数；超时会终止 worker 并使整次运行失败。
worker_timeout_seconds=1800

## ====================
## Profiling | 性能统计
## ====================

# @name: Enable Profiling | 启用性能统计
# @type: bool
enable_profiling=true

# @name: Metrics Config | 性能指标配置
metrics_config=time

# @name: Log Level | 日志级别
# @options: 0, 1, 2
log_level=0

## Detector Settings | 检测器设置

# @name: NMS Radius | 非极大抑制半径
# @type: int
# @range: 0, 64
nms_radius=4

# @name: Border Removal | 边界排除
# @type: int
# @range: 0, 64
remove_borders=4

# @name: Random Seed | 随机种子
# @type: int
random_seed=31
